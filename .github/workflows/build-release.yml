name: Build and Release (Windows 11)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-test:
    name: Test, Package and Attest (Windows)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      UV_LINK_MODE: copy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies with uv
        run: uv sync --extra dev --link-mode=copy

      - name: Run automated pytest suite
        run: uv run --no-sync pytest -q --tb=short

      - name: Verify local signing script (DryRun + PowerShell AST)
        shell: powershell
        run: |
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/sign_local.ps1"), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw "PowerShell parse errors in scripts/sign_local.ps1" }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sign_local.ps1 -DryRun

      - name: Ensure Inno Setup 6 is installed
        shell: powershell
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc -and -not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build Portable EXE, Inno Setup Installer and SHA256SUMS.txt
        run: uv run --no-sync python scripts/build_exe.py

      - name: Smoke-test packaged Portable EXE startup
        shell: powershell
        run: |
          $env:PDF_LECTOR_BENCH_STARTUP = "1"
          $env:PDF_LECTOR_BENCH_EXIT = "1"
          $env:QT_QPA_PLATFORM = "offscreen"
          & ".\dist\PDF-MD-Lector-Portable.exe"
          if ($LASTEXITCODE -ne 0) { throw "Packaged executable smoke test failed ($LASTEXITCODE)" }

      - name: Verify SHA256SUMS.txt
        shell: powershell
        run: |
          Get-Content dist/SHA256SUMS.txt
          foreach ($line in Get-Content dist/SHA256SUMS.txt) {
            if ($line -match '^([0-9a-f]{64})  (.+)$') {
              $expected = $Matches[1]
              $file = Join-Path "dist" $Matches[2]
              $actual = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($expected -ne $actual) { throw "Checksum mismatch for $file" }
            } else {
              throw "Malformed SHA256SUMS line: $line"
            }
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-md-lector-windows-x64
          path: |
            dist/PDF-MD-Lector-Portable.exe
            dist/PDF-MD-Lector-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Generate SLSA Build Provenance Attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/PDF-MD-Lector-Portable.exe
            dist/PDF-MD-Lector-Setup.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/PDF-MD-Lector-Portable.exe
            dist/PDF-MD-Lector-Setup.exe
            dist/SHA256SUMS.txt

  # ---------------------------------------------------------------------------
