<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>PDF/MD Lector by TRODAI</title>
  <style>
    * { box-sizing: border-box; border-radius: 0px; }
    body {
      margin: 0;
      padding: 14px;
      width: 310px;
      background: #0B0F19;
      color: #F8FAFC;
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1F2A3E;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .title { font-weight: 700; font-size: 14px; letter-spacing: 0.4px; }
    .badge {
      background: #152E28;
      border: 1px solid #2B6A5A;
      color: #6EE7B7;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
    }
    label { display: block; color: #94A3B8; font-size: 11px; margin: 8px 0 4px; }
    input {
      width: 100%;
      background: #131B2C;
      color: #F8FAFC;
      border: 1px solid #334155;
      padding: 6px 8px;
      font-size: 12px;
    }
    button {
      width: 100%;
      margin-top: 8px;
      padding: 8px 10px;
      background: #182234;
      color: #F8FAFC;
      border: 1px solid #334155;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
    }
    button.primary {
      background: #F8FAFC;
      color: #0B0F19;
      border-color: #F8FAFC;
      font-weight: 700;
    }
    #status {
      margin-top: 10px;
      padding: 8px;
      background: #101624;
      border: 1px solid #1F2A3E;
      color: #CBD5E1;
      font-size: 11px;
      min-height: 36px;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">PDF/MD Lector</span>
    <span class="badge">TRODAI LOCAL</span>
  </div>

  <label for="outputPath">Archivo PDF de salida local</label>
  <input id="outputPath" type="text" placeholder="C:\Users\...\Documents\captura.pdf">

  <button id="btnCapture" class="primary">Convertir pagina actual a PDF</button>
  <button id="btnOpenLocal">Abrir documento local en visor</button>
  <button id="btnPing">Verificar Native Host</button>

  <div id="status">Listo. Comunicacion local via Native Messaging.</div>
  <script src="popup.js"></script>
</body>
</html>
