name: Bug Report
description: Report a reproducible bug in PDF/MD Lector by TRODAI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Privacy reminder: Please use the in-app Support Dialog to anonymize logs before pasting. Never include personal Windows usernames, OneDrive paths, emails, or confidential PDF/Markdown content.
  - type: input
    id: version
    attributes:
      label: Application Version
      description: Example: 0.1.0 (Portable or Setup)
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows Version
      placeholder: "Windows 11 24H2 x64"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Clear steps to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Anonymized Logs (Optional)
      description: Paste ONLY anonymized crash/app logs generated by SupportDialog.
      render: text
